<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFP — Painel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-titulo">
    <img src="LOGO-IFP.png" alt="Logo IFP" class="topbar-logo">
    <h1 id="titulo-topbar">PAINEL IFP</h1>
  </div>
  <button class="sair" id="btn-sair">Sair</button>
</div>

<div class="container">
  <div class="card">
    <h2>Escolha a unidade</h2>
    <p>Selecione a unidade do IFP para continuar.</p>

    <label for="select-unidade">Unidade</label>
    <select id="select-unidade">
      <option value="">Carregando unidades...</option>
    </select>
  </div>

  <div class="status-box" id="status-box"></div>
</div>

<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
