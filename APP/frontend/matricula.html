<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFP — Matrícula</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <img src="LOGO-IFP.png" alt="Logo IFP" class="login-logo">
    <h1>Faça sua matrícula</h1>
    <p class="subtitle">Você foi indicado por um aluno IFP</p>

    <form id="form-matricula">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf">

      <button type="submit" class="btn btn-primary" id="btn-enviar">Enviar interesse</button>
      <div class="erro-msg" id="msg"></div>
    </form>

    <p class="subtitle" style="margin-top:20px;">
      * O pagamento e a confirmação final da matrícula serão feitos separadamente pela equipe IFP.
    </p>
  </div>
</div>

<script src="config.js"></script>
<script src="matricula.js"></script>
</body>
</html>
