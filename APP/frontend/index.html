<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Relatórios</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <img src="LOGO-NIT-CIANO.png" alt="Logo" class="login-logo">
    <h1>LOGIN</h1>
    <p class="subtitle">Entre com suas credenciais para acessar o painel</p>

    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
      <div class="erro-msg" id="erro-msg"></div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
