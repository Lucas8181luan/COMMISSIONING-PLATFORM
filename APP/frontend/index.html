<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFP — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <img src="LOGO-IFP.png" alt="Logo IFP" class="login-logo">
    <h1>Escolha sua unidade</h1>
    <p class="subtitle">Selecione a unidade para continuar</p>

    <label for="select-unidade">Unidade</label>
    <select id="select-unidade">
      <option value="">Carregando unidades...</option>
    </select>

    <button class="btn btn-primary" id="btn-continuar" style="margin-top:20px;">Continuar</button>
    <div class="erro-msg" id="erro-msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="unidade.js"></script>
</body>
</html>
